[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "support-agent"
version = "0.1.0"
description = "Multi-step AI customer support agent backed by a mock e-commerce CRM."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "SQLAlchemy>=2.0.30,<3",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "google-genai>=1.50,<4",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint>=4.3,<5",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
support-crm = "support_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that use a real (temporary) SQLite database",
    "live: calls the real Gemini API (opt-in via RUN_LIVE_TESTS=1)",
]

[tool.coverage.run]
source = ["support_agent"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
